<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AquaTwin Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Control-room console: clock + replay + KPIs, map left, alarm detail and feed right,
   one signal strip per metered zone along the bottom. One deliberate dark look. */
:root { color-scheme: dark;
  --bg:#0b1219; --panel:#101a24; --raise:#15212d; --line:#213041; --fg:#dde6ee; --muted:#8597a8; --faint:#5b6c7c;
  --accent:#5ec8dc; --ok:#45b383; --warn:#e3a63d; --crit:#e5574e;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace; }
* { box-sizing:border-box } html,body { margin:0; height:100% } [hidden] { display:none !important }
body { background:var(--bg); color:var(--fg); font:14px/1.45 var(--sans) }
.app { display:grid; grid-template-rows:auto 1fr auto; gap:12px; min-height:100%;
  padding-block:14px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)) }
header { display:flex; flex-wrap:wrap; align-items:center; gap:12px 24px }
.brand { display:flex; align-items:baseline; gap:10px; min-width:0 }
.brand b { font:600 20px/1 var(--cond); letter-spacing:.02em } .brand span { color:var(--muted); font-size:12px }
.clock { font:500 15px/1 var(--mono); font-variant-numeric:tabular-nums }
.clock small { color:var(--muted); font:400 11px var(--sans); text-transform:uppercase; letter-spacing:.08em; margin-right:6px }
.replay { display:flex; align-items:center; gap:10px; flex:1 1 320px; min-width:0 }
.replay input[type=range] { flex:1; accent-color:var(--accent); min-width:0 }
button { font:500 13px var(--sans); color:var(--fg); background:var(--raise); border:1px solid var(--line); border-radius:6px; padding:7px 12px; cursor:pointer }
button:hover { border-color:var(--accent) } button.primary { background:var(--accent); color:#062029; border-color:var(--accent) }
button:focus-visible, input:focus-visible, .alarm:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
.toggle { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; cursor:pointer; user-select:none } .toggle input { accent-color:var(--ok) }
.kpis { display:flex; flex-wrap:wrap; gap:8px 22px; width:100%; padding:10px 14px; background:var(--panel); border:1px solid var(--line); border-radius:8px }
.kpi { display:flex; flex-direction:column; gap:2px; min-width:110px }
.kpi label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em }
.kpi output { font:500 18px/1.1 var(--mono); font-variant-numeric:tabular-nums }
.ok { color:var(--ok) } .crit { color:var(--crit) } .warn { color:var(--warn) }
main { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr); gap:12px; min-height:0 }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; min-width:0; display:flex; flex-direction:column }
.panel h2 { font:600 12px var(--cond); text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:0; padding:10px 14px;
  border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px }
.panel h2 em { font-style:normal; color:var(--faint); font-family:var(--sans); letter-spacing:.04em; text-transform:none; font-weight:400 }
.mapwrap { position:relative; padding:8px; flex:1; min-height:260px; overflow:hidden }
svg.map { width:100%; height:100%; display:block; transition:opacity .35s ease }
#map3d { position:absolute; inset:0; width:100%; height:100%; opacity:0; pointer-events:none; transition:opacity .35s ease; cursor:grab }
#map3d.on { opacity:1; pointer-events:auto } #map3d:active { cursor:grabbing }
.mapwrap.is3d svg.map { opacity:0; pointer-events:none }
.hint3d { position:absolute; left:14px; bottom:10px; color:var(--muted); font-size:11.5px; background:rgba(16,26,36,.8); padding:4px 8px; border-radius:4px; pointer-events:none }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; text-transform:none; letter-spacing:0 }
.seg button { border:0; border-radius:0; padding:3px 10px; font:500 12px var(--sans); background:transparent; color:var(--muted) }
.seg button[aria-pressed=true] { background:var(--accent); color:#062029 }
.banner { width:100%; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 14px; background:var(--raise); border:1px solid var(--accent); border-radius:8px; font-size:13px }
.banner-actions { display:flex; gap:8px; flex-wrap:wrap }
body.previewing .kpis, body.previewing .replay, body.previewing #keywrap, body.previewing .side, body.previewing .signals,
body.previewing .clock { display:none }
body.previewing main { grid-template-columns:1fr }
body.previewing .app { grid-template-rows:auto 1fr }
.detail.swap { animation:swap .22s ease-out }
@keyframes swap { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
@media (prefers-reduced-motion:reduce) { .detail.swap { animation:none } svg.map, #map3d { transition:none } }
.legend { display:flex; flex-wrap:wrap; gap:6px 14px; padding:8px 14px 12px; color:var(--muted); font-size:11.5px }
.legend i { display:inline-block; width:16px; height:3px; border-radius:2px; margin-right:6px; vertical-align:2px }
.legend i.dot { width:10px; height:10px; border-radius:50%; vertical-align:-1px }
.side { display:grid; grid-template-rows:auto minmax(0,1fr); gap:12px; min-height:0 }
.detail { padding:12px 14px 14px; display:flex; flex-direction:column; gap:10px }
.detail .head { display:flex; align-items:center; gap:8px; flex-wrap:wrap } .detail .title { font:600 16px var(--cond) }
.facts { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px; margin:0 }
.facts dt { color:var(--muted) } .facts dd { margin:0; font-family:var(--mono); font-variant-numeric:tabular-nums }
.actions { display:flex; gap:8px; flex-wrap:wrap } .log { font:12px var(--mono); color:var(--accent); min-height:1.2em }
.verdict { font-size:12.5px; padding:8px 10px; border-radius:6px; background:var(--raise); border-left:3px solid var(--faint) }
.verdict.hit { border-left-color:var(--ok) } .verdict.false { border-left-color:var(--crit) } .verdict.zone { border-left-color:var(--warn) }
.feed { overflow:auto; min-height:160px }
.alarm { display:grid; grid-template-columns:4px 1fr auto; gap:0 10px; padding:9px 14px 9px 0; border-bottom:1px solid var(--line); cursor:pointer }
.alarm:hover, .alarm.sel { background:var(--raise) }
.stripe { border-radius:0 2px 2px 0; background:var(--warn) } .stripe.hit { background:var(--ok) } .stripe.false { background:var(--crit) } .stripe.repeat { background:var(--faint) }
.alarm .l1 { font-weight:500 } .alarm .l2 { color:var(--muted); font-size:12px; font-family:var(--mono) }
.alarm .when { color:var(--muted); font:12px var(--mono); text-align:right; white-space:nowrap }
.chip { font:500 11px var(--sans); padding:2px 7px; border-radius:999px; border:1px solid var(--line); color:var(--fg); white-space:nowrap }
.pill { font:600 10.5px var(--sans); text-transform:uppercase; letter-spacing:.06em; padding:2px 7px; border-radius:4px }
.pill.open { background:rgba(227,166,61,.15); color:var(--warn) } .pill.hit { background:rgba(69,179,131,.15); color:var(--ok) }
.pill.false { background:rgba(229,87,78,.15); color:var(--crit) } .pill.repeat { background:rgba(133,151,168,.15); color:var(--muted) }
.empty { color:var(--muted); padding:18px 14px; font-size:13px }
.signals { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; max-height:36vh; overflow:auto }
.chart { padding:6px 10px 10px } .chart svg { width:100%; height:110px; display:block } .chart text { fill:var(--muted); font:10px var(--mono) }
.now { color:var(--fg); font-family:var(--mono) }
@keyframes ping { from { r:6; opacity:.9 } to { r:22; opacity:0 } } .ping { animation:ping 1.6s ease-out infinite }
@media (prefers-reduced-motion:reduce) { .ping { animation:none; opacity:.5 } }
@media (min-width:901px) { .app { height:100% } main { overflow:hidden } .side > .panel:last-child { min-height:0 } }
@media (max-width:900px) { main { grid-template-columns:1fr } .signals { max-height:none } }
</style></head><body>
<div class="app">
  <header>
    <div class="brand"><b>AquaTwin</b><span id="netname"></span></div>
    <div class="clock"><small>Network time</small><span id="clock"></span></div>
    <div class="replay">
      <button id="play" class="primary" aria-label="Play replay">Play</button>
      <input id="day" type="range" aria-label="Day">
    </div>
    <label class="toggle" id="keywrap" hidden><input id="key" type="checkbox"> Compare with answer key</label>
    <button id="openbtn" title="Draw any EPANET network in plan and 3D">Open network file</button>
    <input id="openfile" type="file" accept=".inp" hidden>
    <div class="banner" id="banner" hidden role="status">
      <span id="banner-text"></span>
      <span class="banner-actions"><button id="banner-plan" class="primary" hidden>Plan sensors for this network</button>
      <button id="banner-back">Back to the monitored network</button></span>
    </div>
    <div class="kpis" aria-live="polite">
      <div class="kpi"><label>Alarms raised</label><output id="k-alarms">0</output></div>
      <div class="kpi"><label>Open alarms (14 days)</label><output id="k-open" class="warn">0</output></div>
      <div class="kpi"><label>Sensors online</label><output id="k-sensors"></output></div>
      <div class="kpi kev"><label>Leaks found</label><output id="k-found" class="ok">–</output></div>
      <div class="kpi kev"><label>False alarms</label><output id="k-false" class="crit">–</output></div>
      <div class="kpi kev"><label>Water value saved</label><output id="k-eur">–</output></div>
      <div class="kpi kev"><label>Year: exact pipe · in zone</label><output id="k-zone">–</output></div>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2><span>Network <em id="netinfo"></em></span>
        <span class="seg" role="group" aria-label="Map view">
          <button id="v2d" aria-pressed="true">Plan</button><button id="v3d" aria-pressed="false">3D terrain</button>
        </span></h2>
      <div class="mapwrap" id="mapwrap">
        <svg class="map" id="map" role="img" aria-label="Network map with alarms"></svg>
        <canvas id="map3d" aria-label="3D network view: drag to orbit, scroll to zoom, click a column to select its alarm"></canvas>
        <div class="hint3d" id="hint3d" hidden>Drag to orbit · scroll to zoom · column height = leak size</div>
      </div>
      <div class="legend" id="legend"></div>
    </section>
    <div class="side">
      <section class="panel"><h2>Selected alarm <em id="d-id"></em></h2><div class="detail" id="detail"></div></section>
      <section class="panel"><h2>Alarm feed <em id="feed-count"></em></h2><div class="feed" id="feed"></div></section>
    </div>
  </main>

  <div class="signals" id="signals"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* AquaTwin 3D terrain view, shared by the control room and the sensor plan.
   Draws any network in perspective at its real ground elevations.
   geo: { W, H, zones:[{id,color,segs:[x1,y1,z1,x2,y2,z2,...]}], sources:{id:[x,y,z]} }
   markers: { sensors:[[x,y,z]], columns:[{id,p,h,color,pulse,wide}], rings:[{p,color,opacity}],
              crosses:[{p,color}], boxes:[{p,color}] } */
function Terrain3D(opt) {
  if (!window.THREE) return null;
  const T = THREE, cv = opt.canvas, wrap = opt.wrap, hint = opt.hint;
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const renderer = new T.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  const scene = new T.Scene(), cam = new T.PerspectiveCamera(38, 1, 1, 20000);
  let geo = null, W = 1000, H = 1000, cx = 500, cy = 500;
  const V = (p) => new T.Vector3(p[0] - cx, p[2] || 0, p[1] - cy);
  const netG = new T.Group(), dynG = new T.Group(), colG = new T.Group();
  scene.add(netG, dynG, colG);

  const core = new T.CylinderGeometry(3.2, 3.2, 1, 14); core.translate(0, 0.5, 0);
  const halo = new T.CylinderGeometry(9, 9, 1, 20, 1, true); halo.translate(0, 0.5, 0);
  const disc = new T.RingGeometry(5, 9, 28); disc.rotateX(-Math.PI / 2);
  const ring = new T.RingGeometry(9, 11, 36); ring.rotateX(-Math.PI / 2);
  const sphere = new T.SphereGeometry(4, 12, 8), box = new T.BoxGeometry(12, 12, 12);
  const cols = new Map(), pickable = [];
  let animateNew = false;

  function setGeo(g) {
    geo = g; W = g.W; H = g.H; cx = W / 2; cy = H / 2;
    netG.clear();
    const grid = new T.GridHelper(Math.max(W, H) * 1.25, 28, 0x213041, 0x15212d); grid.position.y = -2; netG.add(grid);
    g.zones.forEach((z) => {
      const s = z.segs || [], a = new Float32Array(s.length);
      for (let i = 0; i < s.length; i += 3) { a[i] = s[i] - cx; a[i + 1] = s[i + 2]; a[i + 2] = s[i + 1] - cy; }
      const bg = new T.BufferGeometry(); bg.setAttribute("position", new T.BufferAttribute(a, 3));
      netG.add(new T.LineSegments(bg, new T.LineBasicMaterial({ color: z.color })));
    });
    const bm = new T.MeshBasicMaterial({ color: 0xdde6ee });
    Object.values(g.sources || {}).forEach((p) => { const m = new T.Mesh(box, bm); m.position.copy(V(p)); m.position.y += 6; netG.add(m); });
    for (const c of cols.values()) colG.remove(c.g);
    cols.clear(); pickable.length = 0;
    if (active) { orb.r = fit(); }
    kick();
  }

  function setMarkers(mk) {
    dynG.clear();
    const sm = new T.MeshBasicMaterial({ color: 0x5ec8dc });
    (mk.sensors || []).forEach((p) => { const m = new T.Mesh(sphere, sm); m.position.copy(V(p)); dynG.add(m); });
    (mk.boxes || []).forEach((b) => {
      const m = new T.Mesh(new T.OctahedronGeometry(7), new T.MeshBasicMaterial({ color: b.color })); m.position.copy(V(b.p)); m.position.y += 8; dynG.add(m);
    });
    (mk.rings || []).forEach((r) => {
      const m = new T.Mesh(ring, new T.MeshBasicMaterial({ color: r.color, transparent: true, opacity: r.opacity ?? 0.7, side: T.DoubleSide }));
      m.position.copy(V(r.p)); m.position.y += 0.8; dynG.add(m);
    });
    (mk.crosses || []).forEach((c) => {
      const mat = new T.MeshBasicMaterial({ color: c.color });
      [Math.PI / 4, -Math.PI / 4].forEach((r) => { const m = new T.Mesh(new T.BoxGeometry(18, 2.5, 3), mat); m.position.copy(V(c.p)); m.position.y += 2; m.rotation.y = r; dynG.add(m); });
    });
    // columns keep their identity so new ones can grow out of the pipe
    const want = new Set((mk.columns || []).map((c) => c.id));
    for (const [id, c] of cols) if (!want.has(id)) { colG.remove(c.g); pickable.splice(pickable.indexOf(c.mc), 1); cols.delete(id); }
    (mk.columns || []).forEach((c) => {
      let o = cols.get(c.id);
      if (!o) {
        const g = new T.Group();
        const mc = new T.Mesh(core, new T.MeshBasicMaterial({ color: c.color, transparent: true, opacity: 0.95 }));
        const mh = new T.Mesh(halo, new T.MeshBasicMaterial({ color: c.color, transparent: true, opacity: 0.14, side: T.DoubleSide, depthWrite: false }));
        const md = new T.Mesh(disc, new T.MeshBasicMaterial({ color: c.color, transparent: true, opacity: 0.7, side: T.DoubleSide }));
        md.position.y = 0.6; mc.userData.id = c.id; g.add(mc, mh, md); colG.add(g); pickable.push(mc);
        o = { g, mc, mh, md, born: animateNew && active && !REDUCED ? performance.now() : -1e9 };
        cols.set(c.id, o);
      }
      o.g.position.copy(V(c.p)); o.h = c.h; o.pulse = c.pulse && !REDUCED;
      [o.mc, o.mh, o.md].forEach((m) => m.material.color.set(c.color));
      o.g.scale.x = o.g.scale.z = c.wide ? 1.5 : 1;
    });
    animateNew = true;
    kick();
  }

  // camera: orbit around the network centre; phi 0 = straight down (matches the plan view)
  const orb = { r: 1000, phi: 0.0001, theta: 0 }; let tween = null, active = false, raf = 0;
  function fit() { const t = Math.tan((cam.fov * Math.PI) / 360); return (Math.max(H, W / cam.aspect) / 2 / t) * 1.06; }
  function place() {
    const { r, phi, theta } = orb;
    cam.position.set(r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.cos(theta));
    cam.lookAt(0, 20, 0);
  }
  function go(to, ms, done) {
    if (REDUCED || !ms) { Object.assign(orb, to); place(); done && done(); kick(); return; }
    tween = { from: { ...orb }, to, t0: performance.now(), ms, done }; kick();
  }
  function frame(now) {
    raf = 0;
    if (tween) {
      const k = Math.min(1, (now - tween.t0) / tween.ms), e = ease(k);
      for (const key in tween.to) orb[key] = tween.from[key] + (tween.to[key] - tween.from[key]) * e;
      if (k >= 1) { const d = tween.done; tween = null; d && d(); }
    }
    place();
    let more = !!tween;
    for (const c of cols.values()) {
      const g = Math.min(1, (now - c.born) / 700);
      c.mc.scale.y = c.mh.scale.y = Math.max(0.01, c.h * (1 - Math.pow(1 - g, 3)));
      if (g < 1) more = true;
      c.mh.material.opacity = c.pulse ? 0.12 + 0.1 * (0.5 + 0.5 * Math.sin(now / 260)) : 0.1;
      if (c.pulse) more = true;
    }
    renderer.render(scene, cam);
    if (active && more) raf = requestAnimationFrame(frame);
  }
  function kick() { if (active && !raf) raf = requestAnimationFrame(frame); }
  function resize() {
    const w = wrap.clientWidth, h = wrap.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); kick();
  }
  new ResizeObserver(resize).observe(wrap);

  let drag = null;
  cv.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, moved: 0, phi: orb.phi, theta: orb.theta }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", (e) => {
    if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
    orb.theta = drag.theta - dx * 0.006; orb.phi = Math.min(1.35, Math.max(0.0001, drag.phi - dy * 0.006)); kick();
  });
  cv.addEventListener("pointerup", (e) => {
    if (drag && drag.moved < 5 && opt.onPick) {
      const r = cv.getBoundingClientRect(), m = new T.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      const rc = new T.Raycaster(); rc.setFromCamera(m, cam);
      const hit = rc.intersectObjects(pickable)[0]; if (hit) opt.onPick(hit.object.userData.id);
    }
    drag = null;
  });
  cv.addEventListener("wheel", (e) => { e.preventDefault(); orb.r = Math.min(fit() * 2.5, Math.max(fit() * 0.2, orb.r * (1 + Math.sign(e.deltaY) * 0.1))); kick(); }, { passive: false });

  setGeo(opt.geo);
  return {
    setGeo, setMarkers,
    enter() {
      active = true; resize(); orb.r = fit(); orb.phi = 0.0001; orb.theta = 0; place();
      wrap.classList.add("is3d"); cv.classList.add("on"); if (hint) hint.hidden = false; kick();
      // cross-fade from the plan into an identical top-down camera, then tilt into perspective
      setTimeout(() => go({ phi: 0.92, theta: -0.38, r: fit() * 1.28 }, 1100), REDUCED ? 0 : 380);
    },
    exit() {
      go({ phi: 0.0001, theta: 0, r: fit() }, 700, () => {
        wrap.classList.remove("is3d"); cv.classList.remove("on"); if (hint) hint.hidden = true;
        setTimeout(() => { active = false; }, 400);
      });
    },
    get on() { return active; },
  };
}

/* Reads an EPANET .inp file in the browser and returns a drawable network:
   { geo: {W,H,zones,sources}, stats } in the same shape the Python export uses.
   Zones: parts of the network separated by pumps and valves (natural districts). */
const AQ_PALETTE = ["#557390", "#63a27f", "#b08b5c", "#8a6fb0", "#b0606b", "#5e9fa8", "#a39a4f", "#7d8796"];

function parseInp(text, name) {
  const sec = {}; let cur = null;
  for (let line of text.split(/\r?\n/)) {
    const c = line.indexOf(";"); if (c >= 0) line = line.slice(0, c);
    line = line.trim(); if (!line) continue;
    if (line[0] === "[") { cur = line.toUpperCase(); sec[cur] = sec[cur] || []; continue; }
    if (cur) sec[cur].push(line.split(/\s+/));
  }
  if (!sec["[PIPES]"] && !sec["[JUNCTIONS]"]) throw new Error("This does not look like an EPANET .inp file: it has no [JUNCTIONS] or [PIPES] section.");
  const elev = {}, kind = {};
  (sec["[JUNCTIONS]"] || []).forEach((r) => { elev[r[0]] = +r[1] || 0; kind[r[0]] = "J"; });
  (sec["[RESERVOIRS]"] || []).forEach((r) => { elev[r[0]] = +r[1] || 0; kind[r[0]] = "R"; });
  (sec["[TANKS]"] || []).forEach((r) => { elev[r[0]] = +r[1] || 0; kind[r[0]] = "T"; });
  const xy = {};

      const svg = sec.querySelector("svg"), W = 600, H = 110, pl = 34, pr = 6, pt = 8, pb = 16, n = s.length - 1;
      const lo = Math.min(...s), hi = Math.max(...s), pd = (hi - lo) * 0.08 || 1, y0 = lo - pd, y1 = hi + pd;
      const X = (d) => pl + (d / n) * (W - pl - pr), Y = (v) => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
      for (let i = 0; i <= 3; i++) { const v = y0 + (i / 3) * (y1 - y0); el("line", { x1: pl, x2: W - pr, y1: Y(v), y2: Y(v), stroke: "var(--line)", "vector-effect": "non-scaling-stroke" }, svg); const t = el("text", { x: 2, y: Y(v) + 3 }, svg); t.textContent = v.toFixed(Math.abs(hi) < 10 ? 1 : 0); }
      const step = Math.max(1, Math.round(n / 6));
      for (let d = 0; d <= n; d += step) { const t = el("text", { x: X(d), y: H - 3 }, svg); const dt = new Date(start.getTime() + d * 864e5); t.textContent = MONTHS[dt.getUTCMonth()] + (n < 120 ? " " + dt.getUTCDate() : ""); }
      const pts = s.map((v, d) => `${X(d).toFixed(1)},${Y(v).toFixed(1)}`);
      el("polyline", { points: pts.slice(0, S.day + 1).join(" "), fill: "none", stroke: zcol[z] || "var(--accent)", "stroke-width": 1.8, "vector-effect": "non-scaling-stroke" }, svg);
      el("polyline", { points: pts.slice(S.day).join(" "), fill: "none", stroke: "var(--faint)", "stroke-width": 1, opacity: 0.35, "vector-effect": "non-scaling-stroke" }, svg);
      visible().filter((a) => a.zone === z).forEach((a) => el("line", { x1: X(a.day), x2: X(a.day), y1: pt, y2: H - pb, stroke: colorOf(a), "stroke-width": 1.2, "vector-effect": "non-scaling-stroke", opacity: 0.8 }, svg));
      el("line", { x1: X(S.day), x2: X(S.day), y1: pt, y2: H - pb, stroke: "var(--fg)", "stroke-dasharray": "3 3", "vector-effect": "non-scaling-stroke" }, svg);
      el("circle", { cx: X(S.day), cy: Y(s[S.day]), r: 3, fill: "var(--fg)" }, svg);
    });
  }

  function kpis() {
    const v = visible();
    $("k-alarms").textContent = v.length;
    $("k-open").textContent = v.filter((a) => S.day - a.day <= 14 && a.status !== "repeat").length;
    if (!EV) return;
    if (S.key) {
      $("k-found").textContent = v.filter((a) => a.status === "hit").length + " / " + EV.n_leaks;
      $("k-false").textContent = v.filter((a) => a.status === "false").length;
      $("k-eur").textContent = money(v.reduce((s, a) => s + (a.value || 0), 0));
      $("k-zone").textContent = `${EV.found} · ${EV.in_candidate_zone} of ${EV.n_leaks}`;
    } else { ["k-found", "k-false", "k-eur", "k-zone"].forEach((k) => ($(k).textContent = "–")); }
  }

  /* ---------- 3D terrain view (shared module: works for the run's network and any network the user opens) ---------- */
  const HEX = { warn: "#e3a63d", ok: "#45b383", crit: "#e5574e", faint: "#5b6c7c", accent: "#5ec8dc" };
  const statusHex = (a) => !S.key || !a.status ? HEX.warn : ({ hit: HEX.ok, false: HEX.crit, repeat: HEX.faint })[a.status];
  const T3 = Terrain3D({ canvas: $("map3d"), wrap: $("mapwrap"), hint: $("hint3d"), geo: DATA.geo, onPick: (id) => select(id) });
  if (!T3) { $("v3d").disabled = true; $("v3d").title = "3D needs an internet connection to load three.js"; }
  const V3 = T3 && {
    update() {
      if (PREVIEW) { T3.setMarkers({ sensors: [], columns: [] }); return; }
      const sel = S.sel != null ? DATA.alarms[S.sel] : null;
      T3.setMarkers({
        sensors: DATA.sensors,
        columns: visible().map((a) => ({ id: a.i, p: a.at, h: 26 + 13 * Math.sqrt(Math.max(0, a.size || 0)), color: statusHex(a),
          pulse: S.day - a.day <= 14 && a.status !== "repeat", wide: a.i === S.sel })),
        rings: sel && sel.day <= S.day ? sel.top.map((p, k) => ({ p, color: HEX.warn, opacity: 0.75 - k * 0.11 })) : [],
        crosses: S.key ? DATA.leaks.filter((l) => l.start <= S.day && l.end >= S.day).map((l) => ({ p: l.at, color: l.found ? HEX.ok : HEX.crit })) : [],
      });
    },
    enter() { this.update(); T3.enter(); },
    exit() { T3.exit(); },
    get on() { return T3.on; },
  };

  /* ---------- open another network (.inp): drawn in plan and 3D from its own map ---------- */
  let PREVIEW = null;
  const inApp = location.protocol.startsWith("http") && location.pathname.startsWith("/job/");
  $("openbtn").addEventListener("click", () => $("openfile").click());
  $("openfile").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const net = parseInp(await f.text(), f.name.replace(/\.inp$/i, ""));
      PREVIEW = { net, file: f };
      setPlay(false);
      buildBase(net.geo, [], `<span><i class="dot" style="background:var(--fg)"></i>Reservoir / tank</span>`);
      gKey.replaceChildren(); gZone.replaceChildren(); gAlarm.replaceChildren();
      if (T3) { T3.setGeo(net.geo); V3.update(); }
      const s = net.stats;
      $("netname").textContent = s.name + " (your network)";
      $("netinfo").textContent = `${s.districts} natural district${s.districts === 1 ? "" : "s"} · ${s.junctions} junctions · ${s.pipes} pipes`;
      $("banner-text").innerHTML = `Showing <b>${s.name}</b>: ${s.junctions} junctions, ${s.pipes} pipes, ${s.pumps} pumps, ${s.valves} valves, ` +
        `${s.reservoirs} reservoir${s.reservoirs === 1 ? "" : "s"}, ${s.tanks} tank${s.tanks === 1 ? "" : "s"}; ground ${s.elev[0].toFixed(0)}–${s.elev[1].toFixed(0)} (model units). ` +
        (inApp ? "Plan sensors for it, or upload SCADA data in the app to monitor it." : "To plan sensors or monitor it, open this file in the AquaTwin app.");
      $("banner-plan").hidden = !inApp;
      $("banner").hidden = false;
      document.body.classList.add("previewing");
    } catch (err) {
      $("banner-text").textContent = "Could not open this file: " + err.message;
      $("banner-plan").hidden = true; $("banner").hidden = false;
    }
    e.target.value = "";
  });
  $("banner-back").addEventListener("click", () => {
    PREVIEW = null; document.body.classList.remove("previewing"); $("banner").hidden = true;
    buildBase(DATA.geo, DATA.sensors, LEGEND_RUN);
    if (T3) T3.setGeo(DATA.geo);
    $("netname").textContent = DATA.name;
    $("netinfo").textContent = `${zones.length} metered zone${zones.length === 1 ? "" : "s"} · ${DATA.n_junctions} junctions · ${DATA.n_pipes} pipes`;
    render();
  });
  $("banner-plan").addEventListener("click", async () => {
    if (!PREVIEW) return;
    const fd = new FormData(); fd.append("inp", PREVIEW.file, PREVIEW.file.name); fd.append("name", PREVIEW.net.stats.name);
    $("banner-text").textContent = "Starting the sensor plan…";
    const r = await fetch("/plan", { method: "POST", body: fd });
    location.href = r.url;
  });
  function setView(threeD) {
    $("v2d").setAttribute("aria-pressed", String(!threeD)); $("v3d").setAttribute("aria-pressed", String(threeD));
    if (!V3) return; if (threeD && !V3.on) V3.enter(); else if (!threeD && V3.on) V3.exit();
  }
  $("v2d").addEventListener("click", () => setView(false));
  $("v3d").addEventListener("click", () => setView(true));

  function render() {
    $("clock").textContent = dateOf(S.day) + " " + String(DATA.night_end).padStart(2, "0") + ":00";
    $("day").value = S.day;
    const lg = $("lg-key"); if (lg) lg.hidden = !S.key;
    drawMap(); drawFeed(); drawDetail(); charts(); kpis();
    if (V3 && V3.on) V3.update();
  }
  function select(i) {
    const changed = S.sel !== i; S.sel = i; render();
    if (changed) { const d = $("detail"); d.classList.remove("swap"); void d.offsetWidth; d.classList.add("swap"); }
  }

  $("day").addEventListener("input", (e) => { S.day = +e.target.value; render(); });
  $("key").addEventListener("change", (e) => { S.key = e.target.checked; render(); });
  let timer = null;
  function setPlay(on) {
    S.playing = on; $("play").textContent = on ? "Pause" : "Play"; $("play").setAttribute("aria-label", on ? "Pause replay" : "Play replay");
    clearInterval(timer);
    if (on) {
      if (S.day >= DATA.days - 1) S.day = DATA.first_day;
      timer = setInterval(() => {
        S.day++;
        const fresh = DATA.alarms.filter((a) => a.day === S.day);
        if (fresh.length) S.sel = fresh[fresh.length - 1].i;
        if (S.day >= DATA.days - 1) setPlay(false);
        render();
      }, 140);
    }
  }
  $("play").addEventListener("click", () => setPlay(!S.playing));
  document.addEventListener("keydown", (e) => { if (e.code === "Space" && e.target.tagName !== "BUTTON" && e.target.tagName !== "INPUT") { e.preventDefault(); setPlay(!S.playing); } });

  // open on a realistic moment: the largest alarm in the first third of the replay period
  const span = DATA.days - DATA.first_day, cut = DATA.first_day + Math.round(span / 3);
  const early = DATA.alarms.filter((a) => a.day >= DATA.first_day && a.day <= cut);
  const pick = early.length ? early.reduce((b, a) => ((a.size || 0) > (b.size || 0) ? a : b)) : DATA.alarms.find((a) => a.day >= DATA.first_day);
  if (pick) { S.day = pick.day; S.sel = pick.i; }
  render();
})();
</script></body></html>
