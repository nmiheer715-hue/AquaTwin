<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1219; }
      #root { width: 100%; height: 100%; position: relative; }
      #ground { position: absolute; inset: 0; background: #0b1219; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="293" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <div id="problem" data-composition-id="problem" data-composition-src="compositions/problem.html" data-start="0" data-duration="35" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="perceive" data-composition-id="perceive" data-composition-src="compositions/perceive.html" data-start="35" data-duration="30" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="decide" data-composition-id="decide" data-composition-src="compositions/decide.html" data-start="65" data-duration="65" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="act" data-composition-id="act" data-composition-src="compositions/act.html" data-start="130" data-duration="39" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="forecast" data-composition-id="forecast" data-composition-src="compositions/forecast.html" data-start="169" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="results" data-composition-id="results" data-composition-src="compositions/results.html" data-start="181" data-duration="45" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="anycity" data-composition-id="anycity" data-composition-src="compositions/anycity.html" data-start="226" data-duration="55" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="close" data-composition-id="close" data-composition-src="compositions/close.html" data-start="281" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"
        data-variable-values='{}'></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
