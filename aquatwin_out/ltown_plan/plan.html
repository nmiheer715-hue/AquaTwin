<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AquaTwin Sensor Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Planning sheet: map with proposed zones, meters and ranked loggers; side panel with the coverage curve. */
:root{color-scheme:dark;--bg:#0b1219;--panel:#101a24;--raise:#15212d;--line:#213041;--fg:#dde6ee;--muted:#8597a8;--faint:#5b6c7c;--accent:#5ec8dc;--meter:#e3a63d;--ok:#45b383;
--sans:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;--cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box} html,body{margin:0;height:100%} body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans)}
.app{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:12px;min-height:100%;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0;display:flex;flex-direction:column}
.panel h2{font:600 12px var(--cond);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0;padding:10px 14px;border-bottom:1px solid var(--line)}
.mapwrap{padding:8px;flex:1;min-height:360px} svg{width:100%;height:100%;display:block}
.body{padding:12px 14px;display:flex;flex-direction:column;gap:14px}
h1{font:600 22px var(--cond);margin:0} .sub{color:var(--muted);font-size:12.5px}
.big{display:flex;gap:22px;flex-wrap:wrap} .big div{display:flex;flex-direction:column} .big label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em} .big output{font:500 24px var(--mono)}
input[type=range]{width:100%;accent-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:12.5px} th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)} th{color:var(--muted);font-weight:500} td{font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 14px 12px;color:var(--muted);font-size:11.5px} .legend i{display:inline-block;width:16px;height:3px;margin-right:6px;vertical-align:2px;border-radius:2px} .legend i.dot{width:10px;height:10px;border-radius:50%;vertical-align:-1px}
.chart svg{height:140px} .chart text{fill:var(--muted);font:10px var(--mono)}
.note{color:var(--muted);font-size:12px}
@media (max-width:900px){.app{grid-template-columns:1fr}}
</style></head><body>
<div class="app">
  <section class="panel"><h2>Network and proposed monitoring</h2>
    <div class="mapwrap"><svg id="map" role="img" aria-label="Network map with recommended loggers"></svg></div>
    <div class="legend" id="legend"></div></section>
  <section class="panel"><h2>Sensor plan</h2>
    <div class="body">
      <div><h1 id="name"></h1><div class="sub" id="sub"></div></div>
      <div><label for="k" class="sub">Pressure loggers to install: <b id="kval"></b></label><input id="k" type="range" min="1"></div>
      <div class="big"><div><label>Leaks detectable</label><output id="det"></output></div><div><label>Localisable to 300 m</label><output id="loc"></output></div><div><label>Est. hardware</label><output id="cost"></output></div></div>
      <div class="chart"><svg id="curve" viewBox="0 0 400 140" preserveAspectRatio="none" role="img" aria-label="Coverage curve"></svg></div>
      <div class="note">Coverage for a 2.5 L/s leak at night: detectable = at least one logger sees a 0.1 m drop; localisable = its pressure pattern differs from every location more than 300 m away. Hardware at ₹4,650 per logger node.</div>
      <table><thead><tr><th>Zone</th><th>Junctions</th><th>Demand L/s</th><th>Loggers</th><th>Inlet meters</th></tr></thead><tbody id="zones"></tbody></table>
    </div></section>
</div>
